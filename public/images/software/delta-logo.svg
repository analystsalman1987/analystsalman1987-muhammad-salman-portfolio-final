<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Golden metallic gradient for Delta 3D Triangle symbol -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="30%" stop-color="#F5B300"/>
      <stop offset="70%" stop-color="#D98A00"/>
      <stop offset="100%" stop-color="#995C00"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="45%" stop-color="#FFC000"/>
      <stop offset="85%" stop-color="#C77800"/>
      <stop offset="100%" stop-color="#7A4500"/>
    </linearGradient>
    <linearGradient id="blueBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B5FA6"/>
      <stop offset="48%" stop-color="#16437E"/>
      <stop offset="52%" stop-color="#0E3160"/>
      <stop offset="100%" stop-color="#1A4A8B"/>
    </linearGradient>
    <linearGradient id="greenLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55A630"/>
      <stop offset="50%" stop-color="#70C638"/>
      <stop offset="100%" stop-color="#4B9326"/>
    </linearGradient>
  </defs>

  <!-- Delta 3D Golden Triangle Icon -->
  <g transform="translate(10, 8)">
    <!-- Base Outer Facets -->
    <polygon points="40,2 78,64 62,64 33,18 20,40 34,40 40,50 6,50 0,64 78,64" fill="url(#goldGrad1)"/>
    <!-- Dimensional Bevels & Depth -->
    <polygon points="40,2 40,16 62,54 78,64" fill="url(#goldGrad2)" opacity="0.95"/>
    <polygon points="40,2 33,18 4,64 0,64" fill="#B37400" opacity="0.6"/>
    <polygon points="33,18 20,40 34,40 40,50 15,50 4,64 62,64 68,54 28,54" fill="url(#goldGrad1)"/>
    <!-- Triangular inner cavity -->
    <polygon points="40,24 53,46 27,46" fill="#CC8500" opacity="0.75"/>
    <!-- Front Face Highlight -->
    <polygon points="40,4 34,18 23,38 34,38 39,46 17,46 8,60 62,60 74,60" fill="url(#goldGrad2)" opacity="0.85"/>
  </g>

  <!-- Text: DELTA (Navy Blue Beveled / Block 3D) -->
  <g transform="translate(98, 38)">
    <text font-family="'Arial Black', 'Impact', 'Trebuchet MS', sans-serif" font-weight="900" font-size="28" letter-spacing="1.5" fill="url(#blueBevel)">
      DELTA
    </text>
  </g>

  <!-- Horizontal Divider Line: Green -->
  <line x1="98" y1="44" x2="252" y2="44" stroke="url(#greenLine)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Text: software (Clean lowercase Green) -->
  <g transform="translate(100, 64)">
    <text font-family="'Century Gothic', 'Tw Cen MT', 'Arial', sans-serif" font-weight="600" font-size="20" letter-spacing="4" fill="#58A82A">
      software
    </text>
  </g>
</svg>
